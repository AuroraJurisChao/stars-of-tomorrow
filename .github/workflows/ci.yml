name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: docker build -t stars-of-tomorrow:ci .
